name: Rappel feuille d'heures 19h30

# Le declenchement vient de Make (scenario « HK + AE - Rappel 19h30 »), a 19h30
# pile. Les plannings GitHub ont ete retires : ils partaient avec 2 a 4 heures
# de retard, le garde-fou « est-il 19h ? » bloquait alors l'envoi, et aucun
# rappel n'est jamais parti.
on:
  workflow_dispatch:
    inputs:
      cible:
        description: "Identifiant d'une seule personne a prevenir (vide = tous les retardataires)"
        required: false
        default: ""

jobs:
  rappel:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer les rappels
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: BEx3Fw-lSV6EB3_8PvyiKgQxwyP5xia-vP4kbB33QDHQAO0xZmEt9oTVaMERHOExwblth_T7j2MS7aMQMuYmzBM
          WEBHOOK: https://hook.eu1.make.com/9pl7cisding52u37wcm2kua3hbk15gjs
          WEBHOOK_ABONNES: https://hook.eu1.make.com/h6x49ttkjzth9utx1mmr5fo0uj1ofwty
          SUBJECT: mailto:sachamuller79@gmail.com
          CIBLE: ${{ inputs.cible }}
        run: |
          npm install --silent web-push@3.6.7
          cat > envoyer.js <<'SCRIPT'
          const webpush = require('web-push');
          webpush.setVapidDetails(process.env.SUBJECT, process.env.VAPID_PUBLIC_KEY, process.env.VAPID_PRIVATE_KEY);

          /* Chaque societe a son app, son titre et son adresse. Un message
             unique enverrait Tristan sur l'app de HK. */
          const SOCIETES = {
            HK: { titre: "HK Terrassement",
                  url:   "https://agencesl68.github.io/HK-feuille-d-heure-/" },
            AE: { titre: "Alsace Épandage",
                  url:   "https://agencesl68.github.io/AE-feuille-d-heure/" }
          };

          (async () => {
            const cible = (process.env.CIBLE || "").trim();
            let cibles, test = false;

            if (cible) {
              /* Envoi de test : on vise un seul abonnement, par son identifiant,
                 sans passer par la liste des retardataires du jour. */
              test = true;
              const r = await fetch(process.env.WEBHOOK_ABONNES, {
                method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
              const tous = (await r.json()).abonnes || [];
              cibles = tous.filter(c => c.id === cible);
              if (!cibles.length) { console.log(`Aucun abonnement pour « ${cible} » -> rien envoye.`); return; }
              console.log(`Test : envoi a ${cibles[0].nom || cible} uniquement.`);
            } else {
              const reponse = await fetch(process.env.WEBHOOK);
              cibles = await reponse.json();
              console.log(`A rappeler : ${cibles.length} personne(s)`);
              if (!cibles.length) { console.log("Personne n'a oublie -> aucun envoi."); return; }
            }

            let ok = 0, ko = 0;
            for (const c of cibles) {
              if (!c.endpoint) continue;
              const s = SOCIETES[c.societe] || SOCIETES.HK;   /* repli : HK */
              const message = JSON.stringify(test
                ? { title: "Test de notification",
                    body:  "Si tu vois ce message, les notifications fonctionnent.",
                    url:   s.url }
                : { title: s.titre,
                    body:  "N'oublie pas de remplir ta feuille d'heures",
                    url:   s.url });
              const abonnement = { endpoint: c.endpoint, keys: { p256dh: c.p256dh, auth: c.auth } };
              try {
                const res = await webpush.sendNotification(abonnement, message, { TTL: 7200 });
                console.log(`OK  ${c.nom} [${c.societe || "HK"}] (${res.statusCode})`); ok++;
              } catch (e) {
                console.log(`KO  ${c.nom} [${c.societe || "HK"}] : ${e.statusCode || ""} ${e.body || e.message || ""}`); ko++;
              }
            }
            console.log(`Bilan : ${ok} envoye(s), ${ko} echec(s)`);
            if (ok === 0 && ko > 0) process.exit(1);
          })();
          SCRIPT
          node envoyer.js
